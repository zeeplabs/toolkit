name: publish-to-npm
on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install Yarn
        run: npm install -g yarn

      - run: yarn install --frozen-lockfile
      - run: yarn lint:check
      - run: yarn lint:format:check
      - run: yarn test
      - run: yarn build

  publish:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          scope: '@zeeptech'

      - name: Install Yarn
        run: npm install -g yarn

      # Trusted publishing (OIDC) requires npm CLI >= 11.5.1; .nvmrc's Node
      # version ships an older bundled npm, so upgrade it explicitly.
      - name: Upgrade npm for trusted publishing support
        run: npm install -g npm@latest

      - run: yarn install --frozen-lockfile
      - run: yarn build

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: npm publish --access public

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Commits land straight on main (no PR flow), so GitHub's PR-based
      # generate_release_notes has nothing to list. Build the notes from
      # commit subjects since the previous tag instead.
      - name: Generate release notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}~1" 2>/dev/null || true)
          {
            echo "## What's Changed"
            echo
            if [ -n "$PREV_TAG" ]; then
              git log --pretty=format:"- %s (%h)" "$PREV_TAG..${GITHUB_REF_NAME}"
            else
              git log --pretty=format:"- %s (%h)" "${GITHUB_REF_NAME}"
            fi
            echo
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${GITHUB_REF_NAME}"
            fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
